# Docker Compose for Local Development
#
# Start services: docker-compose up -d
# Stop services: docker-compose down
# View logs: docker-compose logs -f

version: '3.8'

services:
  # NATS with JetStream for access log ingestion
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    command: ["--jetstream", "--store_dir", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS Box for CLI access and stream setup
  nats-box:
    image: natsio/nats-box:latest
    depends_on:
      nats:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      nats -s nats:4222 stream add ENVOY_ACCESS_LOGS \
        --subjects='envoy.access.logs' \
        --retention=limits \
        --max-age=7d \
        --storage=file \
        --replicas=1 \
        --defaults || true;
      nats -s nats:4222 consumer add ENVOY_ACCESS_LOGS flink-httproute-analytics \
        --ack=explicit \
        --deliver=all \
        --max-deliver=5 \
        --filter='envoy.access.logs' \
        --defaults || true;
      echo 'JetStream setup complete';
      tail -f /dev/null
      "

  # Nessie catalog for Iceberg
  nessie:
    image: projectnessie/nessie:0.76.0
    ports:
      - "19120:19120"
    environment:
      - QUARKUS_HTTP_PORT=19120
      - NESSIE_VERSION_STORE_TYPE=IN_MEMORY
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v1/config"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create the Iceberg warehouse bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/iceberg-warehouse --ignore-existing;
      mc mb local/flink-checkpoints --ignore-existing;
      mc mb local/flink-savepoints --ignore-existing;
      exit 0;
      "

  # Flink JobManager for local testing
  flink-jobmanager:
    image: flink:1.20.3-java17
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: s3://flink-checkpoints/
        state.savepoints.dir: s3://flink-savepoints/
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path-style-access: true
    volumes:
      - flink-data:/opt/flink/data
      - ./httproute-realtime-analytics/target:/opt/flink/usrlib

  # Flink TaskManager
  flink-taskmanager:
    image: flink:1.20.3-java17
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: rocksdb
        state.checkpoints.dir: s3://flink-checkpoints/
        state.savepoints.dir: s3://flink-savepoints/
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path-style-access: true
    volumes:
      - flink-data:/opt/flink/data
      - ./httproute-realtime-analytics/target:/opt/flink/usrlib
    scale: 2

  # RisingWave for SQL-based streaming analytics (alternative to Flink)
  risingwave:
    image: risingwavelabs/risingwave:v1.5.0-standalone
    ports:
      - "4566:4566"   # PostgreSQL protocol
      - "5691:5691"   # HTTP monitoring
    command: standalone
    volumes:
      - risingwave-data:/risingwave/state_store
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5691/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nats-data:
  minio-data:
  flink-data:
  risingwave-data:
