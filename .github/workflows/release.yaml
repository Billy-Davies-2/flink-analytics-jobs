name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Run tests
        run: mvn test -B

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            httproute-realtime-analytics/target/*-shaded.jar
          retention-days: 7

  version-and-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Parse current version
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Get commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          # Determine bump type based on commit message
          SHOULD_RELEASE="false"
          if echo "$COMMIT_MSG" | grep -iqE '\bmajor\b'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            SHOULD_RELEASE="true"
            echo "Bumping major version"
          elif echo "$COMMIT_MSG" | grep -iqE '\bminor\b'; then
            MINOR=$((MINOR + 1))
            PATCH=0
            SHOULD_RELEASE="true"
            echo "Bumping minor version"
          elif echo "$COMMIT_MSG" | grep -iqE '\bfeat\b'; then
            PATCH=$((PATCH + 1))
            SHOULD_RELEASE="true"
            echo "Bumping patch version"
          else
            echo "No version bump keywords found in commit message"
          fi
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "Should release: $SHOULD_RELEASE"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

  release:
    needs: version-and-release
    runs-on: ubuntu-latest
    if: needs.version-and-release.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ needs.version-and-release.outputs.new_version }}" != "" ]]; then
            echo "VERSION=${{ needs.version-and-release.outputs.new_version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build release JARs
        run: mvn clean package -DskipTests -B

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp httproute-realtime-analytics/target/httproute-realtime-analytics-*-shaded.jar \
             release-assets/httproute-realtime-analytics.jar

      - name: Generate release notes
        id: release_notes
        run: |
          cat << EOF > release-notes.md
          ## Flink Analytics Jobs v${{ steps.get_version.outputs.VERSION }}

          ### Included Jobs

          - **httproute-realtime-analytics.jar** - Real-time HTTPRoute access log analytics

          ### Deployment

          Deploy using the Flink Kubernetes Operator:

          \`\`\`yaml
          apiVersion: flink.apache.org/v1beta1
          kind: FlinkDeployment
          metadata:
            name: httproute-realtime-analytics
            namespace: analytics
          spec:
            image: flink:1.20.0-java21
            flinkVersion: v1_20
            job:
              jarURI: local:///opt/flink/usrlib/httproute-realtime-analytics.jar
              parallelism: 2
              upgradeMode: savepoint
              state: running
          \`\`\`

          ### Checksums

          \`\`\`
          $(sha256sum release-assets/*.jar)
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: version-and-release
    runs-on: ubuntu-latest
    if: needs.version-and-release.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ needs.version-and-release.outputs.new_version }}" != "" ]]; then
            echo "VERSION=${{ needs.version-and-release.outputs.new_version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build JARs
        run: mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.get_version.outputs.VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
