name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Run tests
        run: mvn test -B

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            httproute-realtime-analytics/target/*-shaded.jar
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build release JARs
        run: mvn clean package -DskipTests -B

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp httproute-realtime-analytics/target/httproute-realtime-analytics-*-shaded.jar \
             release-assets/httproute-realtime-analytics.jar

      - name: Generate release notes
        id: release_notes
        run: |
          cat << EOF > release-notes.md
          ## Flink Analytics Jobs v${{ steps.get_version.outputs.VERSION }}

          ### Included Jobs

          - **httproute-realtime-analytics.jar** - Real-time HTTPRoute access log analytics

          ### Deployment

          Deploy using the Flink Kubernetes Operator:

          \`\`\`yaml
          apiVersion: flink.apache.org/v1beta1
          kind: FlinkDeployment
          metadata:
            name: httproute-realtime-analytics
            namespace: analytics
          spec:
            image: flink:1.20.0-java21
            flinkVersion: v1_20
            job:
              jarURI: local:///opt/flink/usrlib/httproute-realtime-analytics.jar
              parallelism: 2
              upgradeMode: savepoint
              state: running
          \`\`\`

          ### Checksums

          \`\`\`
          $(sha256sum release-assets/*.jar)
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build JARs
        run: mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/flink-analytics-jobs:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/flink-analytics-jobs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
