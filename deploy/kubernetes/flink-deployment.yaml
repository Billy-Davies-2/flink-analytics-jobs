apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: httproute-realtime-analytics
  namespace: analytics
spec:
  image: flink:1.20.3-java17
  flinkVersion: v1_20
  
  flinkConfiguration:
    # Task Slots
    taskmanager.numberOfTaskSlots: "2"
    
    # State Backend
    state.backend: rocksdb
    state.backend.incremental: "true"
    state.checkpoints.dir: s3a://flink-checkpoints/httproute-analytics
    state.savepoints.dir: s3a://flink-savepoints/httproute-analytics
    
    # Checkpointing
    execution.checkpointing.interval: "60000"
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.min-pause: "30000"
    execution.checkpointing.timeout: "120000"
    execution.checkpointing.max-concurrent-checkpoints: "1"
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    
    # S3 Configuration (adjust for your MinIO/S3 setup)
    s3.endpoint: http://minio.storage.svc.cluster.local:9000
    s3.access-key: ${S3_ACCESS_KEY}
    s3.secret-key: ${S3_SECRET_KEY}
    s3.path-style-access: "true"
    
    # Memory Configuration
    jobmanager.memory.process.size: 1024m
    taskmanager.memory.process.size: 2048m
    taskmanager.memory.managed.fraction: "0.4"
    
    # Network
    taskmanager.network.memory.fraction: "0.1"
    taskmanager.network.memory.min: 64mb
    taskmanager.network.memory.max: 256mb
    
    # Metrics
    metrics.reporters: prometheus
    metrics.reporter.prometheus.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prometheus.port: "9249"
    
    # Web UI
    web.cancel.enable: "true"
    web.submit.enable: "false"
    
  serviceAccount: flink
  
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
          volumeMounts:
            - name: flink-logs
              mountPath: /opt/flink/log
      volumes:
        - name: flink-logs
          emptyDir: {}
  
  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.5
    podTemplate:
      spec:
        containers:
          - name: flink-main-container
            ports:
              - containerPort: 9249
                name: metrics
  
  taskManager:
    resource:
      memory: "2048m"
      cpu: 1
    replicas: 2
    podTemplate:
      spec:
        containers:
          - name: flink-main-container
            ports:
              - containerPort: 9249
                name: metrics
  
  job:
    jarURI: local:///opt/flink/usrlib/httproute-realtime-analytics.jar
    args:
      - "--nats.url"
      - "nats://nats.analytics.svc.cluster.local:4222"
      - "--nats.stream"
      - "ENVOY_ACCESS_LOGS"
      - "--nats.subject"
      - "envoy.access.logs"
      - "--nats.consumer"
      - "flink-httproute-analytics"
      - "--nessie.uri"
      - "http://nessie.analytics.svc.cluster.local:19120/api/v1"
      - "--iceberg.warehouse"
      - "s3a://iceberg-warehouse"
      - "--parallelism"
      - "2"
      - "--latency.threshold.ms"
      - "500"
    parallelism: 2
    upgradeMode: savepoint
    state: running
    allowNonRestoredState: false
    savepointTriggerNonce: 0
  
  ingress:
    template: "flink.{{namespace}}.{{name}}.example.com"
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: analytics
type: Opaque
stringData:
  access-key: "your-access-key"
  secret-key: "your-secret-key"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: analytics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-role
  namespace: analytics
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-role-binding
  namespace: analytics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink-role
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: analytics
